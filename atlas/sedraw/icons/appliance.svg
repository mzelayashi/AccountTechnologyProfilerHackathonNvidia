  <!-- Gear teeth -->
  <rect x="38" y="14" width="4" height="4" rx="0.5" fill="#455a64" stroke="#78909c" stroke-width="0.5"/>
  <rect x="38" y="32" width="4" height="4" rx="0.5" fill="#455a64" stroke="#78909c" stroke-width="0.5"/>
  <rect x="29" y="23" width="4" height="4" rx="0.5" fill="#455a64" stroke="#78909c" stroke-width="0.5"/>
  <rect x="47" y="23" width="4" height="4" rx="0.5" fill="#455a64" stroke="#78909c" stroke-width="0.5"/>
  <rect x="31" y="16" width="3.5" height="3.5" rx="0.5" fill="#455a64" stroke="#78909c" stroke-width="0.5" transform="rotate(-45 32.75 17.75)"/>
  <rect x="45.5" y="16" width="3.5" height="3.5" rx="0.5" fill="#455a64" stroke="#78909c" stroke-width="0.5" transform="rotate(45 47.25 17.75)"/>
  <rect x="31" y="30.5" width="3.5" height="3.5" rx="0.5" fill="#455a64" stroke="#78909c" stroke-width="0.5" transform="rotate(45 32.75 32.25)"/>
  <rect x="45.5" y="30.5" width="3.5" height="3.5" rx="0.5" fill="#455a64" stroke="#78909c" stroke-width="0.5" transform="rotate(-45 47.25 32.25)"/>
  <!-- Ports (bottom) -->
  <rect x="10" y="34" width="4" height="4" rx="0.5" fill="#1e272e" stroke="#4a6572" stroke-width="0.4"/>
  <rect x="16" y="34" width="4" height="4" rx="0.5" fill="#1e272e" stroke="#4a6572" stroke-width="0.4"/>
