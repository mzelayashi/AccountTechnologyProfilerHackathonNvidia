<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 50">
  <!-- Blue-tinted chassis -->
  <rect x="4" y="8" width="72" height="34" rx="3" fill="#1a237e" stroke="#283593" stroke-width="1.5"/>
  <!-- Directional arrows symbol (center) -->
  <circle cx="40" cy="25" r="11" fill="#0d47a1" stroke="#42a5f5" stroke-width="1"/>
  <!-- Cross arrows -->
  <line x1="40" y1="17" x2="40" y2="33" stroke="#90caf9" stroke-width="1.5"/>
  <line x1="32" y1="25" x2="48" y2="25" stroke="#90caf9" stroke-width="1.5"/>
  <!-- Arrow heads -->
  <polygon points="40,17 37,21 43,21" fill="#90caf9"/>
  <polygon points="40,33 37,29 43,29" fill="#90caf9"/>
  <polygon points="32,25 36,22 36,28" fill="#90caf9"/>
  <polygon points="48,25 44,22 44,28" fill="#90caf9"/>
  <!-- Ports (left side) -->
  <rect x="10" y="14" width="5" height="5" rx="0.5" fill="#1e272e" stroke="#4a6572" stroke-width="0.4"/>
  <rect x="10" y="22" width="5" height="5" rx="0.5" fill="#1e272e" stroke="#4a6572" stroke-width="0.4"/>
  <rect x="10" y="30" width="5" height="5" rx="0.5" fill="#1e272e" stroke="#4a6572" stroke-width="0.4"/>
  <!-- Ports (right side) -->
  <rect x="65" y="14" width="5" height="5" rx="0.5" fill="#1e272e" stroke="#4a6572" stroke-width="0.4"/>
  <rect x="65" y="22" width="5" height="5" rx="0.5" fill="#1e272e" stroke="#4a6572" stroke-width="0.4"/>
  <rect x="65" y="30" width="5" height="5" rx="0.5" fill="#1e272e" stroke="#4a6572" stroke-width="0.4"/>
  <!-- Status LEDs -->
  <circle cx="20" cy="37" r="1.5" fill="#00b894"/>
  <circle cx="26" cy="37" r="1.5" fill="#0984e3"/>
</svg>